services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_NAME=schat-local
      - PORT=8080
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO=mongodb://mongo:27017/SChat
      - JWT_SECRET=schat-dev-jwt-secret-change-in-production
      - JWT_REFRESH_SECRET=schat-dev-refresh-secret-change-in-production
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
